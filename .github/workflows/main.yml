name: etlpipeline
on:
  push:
    branches:
      - main

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: job1
        run: echo "job 1 executed"
  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: job2
        run: echo "job 2 executed"
  job3:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: job3
        run: echo "job 3 executed"
  job4:
    needs: job2
    runs-on: ubuntu-latest
    steps:
      - name: job4
        run: echo "job 4 executed "
  job5:
    needs: job3
    runs-on: ubuntu-latest
    steps:
      - name: job5
        run: echo "job 5 executed "
  job6:
    needs: [job4, job5]
    runs-on: ubuntu-latest
    steps:
      - name: job6
        run: echo "job 6 executed "
