name: etlpipeline
on:
  push:
    branches:
      - main

jobs:
  extract1:
    runs-on: ubuntu-latest
    steps:
      - name: extract1
        run: echo "extract1.py executed"
  transform1:
    needs: extract1
    runs-on: ubuntu-latest
    steps:
      - name: transform1
        run: echo "transform1.py executed"
  load1:
    needs: transform1
    runs-on: ubuntu-latest
    steps:
      - name: load1
        run: echo "load1.py executed"
  extract1:
    needs: transform1
    runs-on: ubuntu-latest
    steps:
      - name: extract1
        run: echo "extract1.py executed "
  transform1:
    needs: load1
    runs-on: ubuntu-latest
    steps:
      - name: transform1
        run: echo "transform1.py executed "
  load1:
    needs: [extract1, transform1]
    runs-on: ubuntu-latest
    steps:
      - name: load1
        run: echo "load1.py executed "
